name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate CLI
        run: npm test

      - name: Verify JSON export
        run: node index.js --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => JSON.parse(data));"

      - name: Inspect package contents
        run: npm pack --dry-run
